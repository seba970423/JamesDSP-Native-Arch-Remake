name: Native PipeWire package
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  layout-smoke:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare minimal Arch source checks
        run: |
          pacman -Syu --noconfirm --needed git python sudo gdb actionlint
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Validate GitHub Actions workflows
        run: actionlint -color .github/workflows/build.yml .github/workflows/release.yml
      - name: Validate patched Devices/Tray UI without compiling audio engine
        env:
          JDSP_NATIVE_PROFILE: standard
        run: |
          sudo -u builder --preserve-env=JDSP_NATIVE_PROFILE makepkg -p PKGBUILD.source --syncdeps --noconfirm --nobuild --cleanbuild
          sudo -u builder python3 scripts/check-setup-wizard.py "$GITHUB_WORKSPACE/src/upstream"
          sudo -u builder bash scripts/check-ui-layout.sh "$GITHUB_WORKSPACE/src/upstream"
          sudo -u builder bash scripts/check-eq-readability.sh "$GITHUB_WORKSPACE/src/upstream"
  package:
    needs: layout-smoke
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, rt]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare Arch build environment
        run: |
          pacman -Syu --noconfirm --needed git python sudo ccache
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          test -x /usr/lib/ccache/bin/g++
          test -x /usr/lib/ccache/bin/gcc

      - name: Restore compiler object cache
        uses: actions/cache@v5
        with:
          path: .ccache
          # One new cache per run; restore previous builds for the same profile.
          key: jdsp-ccache-v1-${{ runner.os }}-${{ matrix.profile }}-${{ github.run_id }}
          restore-keys: |
            jdsp-ccache-v1-${{ runner.os }}-${{ matrix.profile }}-

      - name: Build and check package with ccache
        shell: bash
        env:
          JDSP_NATIVE_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          chown -R builder:builder "$CCACHE_DIR"
          sudo -u builder env \
            JDSP_NATIVE_PROFILE="$JDSP_NATIVE_PROFILE" \
            CCACHE_DIR="$CCACHE_DIR" \
            CCACHE_MAXSIZE="$CCACHE_MAXSIZE" \
            CCACHE_COMPILERCHECK="$CCACHE_COMPILERCHECK" \
            CCACHE_BASEDIR="$GITHUB_WORKSPACE" \
            CCACHE_COMPRESS=1 \
            PATH="/usr/lib/ccache/bin:$PATH" \
            bash scripts/ci-build-with-ccache.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jamesdsp-native-arch-${{ matrix.profile }}
          # Exclude the large split -debug package from user-facing downloads.
          path: 'jamesdsp-native-arch-[0-9]*-x86_64.pkg.tar.zst'
          if-no-files-found: error
  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [layout-smoke, package]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      actions: read
