name: Native PipeWire package
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  layout-smoke:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare minimal Arch source checks
        run: |
          pacman -Syu --noconfirm --needed git python sudo gdb
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Validate patched Devices/Tray UI without compiling audio engine
        env:
          JDSP_NATIVE_PROFILE: standard
        run: |
          sudo -u builder --preserve-env=JDSP_NATIVE_PROFILE makepkg -p PKGBUILD.source --syncdeps --noconfirm --nobuild --cleanbuild
          sudo -u builder python3 scripts/check-setup-wizard.py "$GITHUB_WORKSPACE/src/upstream"
          sudo -u builder bash scripts/check-ui-layout.sh "$GITHUB_WORKSPACE/src/upstream"
          sudo -u builder bash scripts/check-eq-readability.sh "$GITHUB_WORKSPACE/src/upstream"
  package:
    needs: layout-smoke
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, rt]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare Arch build environment
        run: |
          pacman -Syu --noconfirm --needed git python sudo
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build and check package
        env:
          JDSP_NATIVE_PROFILE: ${{ matrix.profile }}
        run: sudo -u builder --preserve-env=JDSP_NATIVE_PROFILE makepkg -p PKGBUILD.source --syncdeps --noconfirm --cleanbuild
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: jamesdsp-native-arch-${{ matrix.profile }}
          path: '*.pkg.tar.zst'
